packages:
  - "apps/*"
  - "!apps/stargate"
  - "packages/*"
  - "packages/services/*"

# 限制 pnpm 11 的 registry 请求并发，保持与 pnpm 10 接近，避免压垮 Verdaccio。
networkConcurrency: 16
trustLockfile: true

catalogs:
  toolchain:
    "@types/node": ^26
    tsx: ~4.23.12
    typescript: ~6.0.3
    vitest: ^4.1.9
  nextjs:
    next: 16.3.3
    react: 19.2.8
    react-dom: 19.2.8
  zod:
    zod: ^4.4.3

packageExtensions:
  "@hookform/resolvers@^5":
    peerDependencies:
      zod: ^4.4.3

overrides:
  "@nestjs/cli>typescript": "catalog:toolchain"
  parse5: ^7.2.1
  webpack: ^5.108.3

allowBuilds:
  "@repo/db@file:packages/db": true
  "@prisma/engines": true
  bufferutil: true
  core-js-pure: true
  esbuild: true
  prisma: true
  sharp: true
