name: PR Feishu Thread

on:
  pull_request:
    types: [opened]
    branches:
      - main
      - 'milestone/*'
      - 'release/*'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  notify-pr-opened:
    name: Notify PR opened
    if: github.actor != 'dependabot[bot]'
    runs-on: arc-runners-mekong
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Get Feishu message ID from PR comments
        id: pr-comments
        uses: ./.github/actions/pr-comment-data
        with:
          pattern: '<!-- feishu_message_id: ([\w-]+) -->'

      - name: Build PR link content
        if: steps.pr-comments.outputs.found != 'true'
        id: pr-content
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          post_content="$(jq -cn \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_title "$PR_TITLE" \
            --arg pr_url "$PR_URL" \
            '{
              zh_cn: {
                title: "stargate-next 新的合并请求",
                content: [[{
                  tag: "a",
                  text: "\($pr_title) #\($pr_number)",
                  href: $pr_url
                }]]
              }
            }')"

          echo "content=$post_content" >> "$GITHUB_OUTPUT"

      - name: Create Feishu thread
        if: steps.pr-comments.outputs.found != 'true'
        id: create-thread
        uses: ./.github/actions/feishu-send
        with:
          app_id: ${{ secrets.FEISHU_APP_ID }}
          app_secret: ${{ secrets.FEISHU_APP_SECRET }}
          chat_id: ${{ secrets.FEISHU_CHAT_ID }}
          msg_type: post
          content: ${{ steps.pr-content.outputs.content }}
          uuid: stargate-next-${{ github.repository_id }}-pr-${{ github.event.pull_request.number }}-thread-v1

      - name: Reply with PR body
        if: steps.pr-comments.outputs.found != 'true'
        uses: ./.github/actions/feishu-reply
        with:
          app_id: ${{ secrets.FEISHU_APP_ID }}
          app_secret: ${{ secrets.FEISHU_APP_SECRET }}
          message_id: ${{ steps.create-thread.outputs.message_id }}
          content: ${{ github.event.pull_request.body || '(无描述)' }}

      - name: Save Feishu thread ID to PR comment
        if: steps.pr-comments.outputs.found != 'true'
        uses: actions/github-script@v9
        env:
          FEISHU_MESSAGE_ID: ${{ steps.create-thread.outputs.message_id }}
        with:
          script: |
            const feishuMarker = '<!-- feishu_message_id:';
            const deployMarker = '<!-- stargate-next-deploy-urls -->';
            const messageId = process.env.FEISHU_MESSAGE_ID;
            const feishuMarkerLine = `<!-- feishu_message_id: ${messageId} -->`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => (
              comment.user?.type === 'Bot' &&
              (
                comment.body?.includes(feishuMarker) ||
                comment.body?.includes(deployMarker)
              )
            ));
            const existingBody = existing?.body || '';
            const body = existing
              ? existingBody.includes(feishuMarker)
                ? existingBody.replace(/<!-- feishu_message_id: [\w-]+ -->/, feishuMarkerLine)
                : [feishuMarkerLine, existingBody].filter(Boolean).join('\n')
              : [
                  feishuMarkerLine,
                  deployMarker,
                  'CI running...',
                ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Skip existing Feishu thread
        if: steps.pr-comments.outputs.found == 'true'
        run: |
          echo "Feishu thread already exists: ${{ steps.pr-comments.outputs.value }}"
