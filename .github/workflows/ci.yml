name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main, "milestone/*", "release/*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: write
  issues: write

env:
  CYCLOPS_BASE_URL: ${{ secrets.CYCLOPS_BASE_URL }}
  HARBOR_DOMAIN: harbor.36node.com
  HARBOR_PROJECT: stargate

jobs:
  notify-main-updated:
    name: Notify main updated
    if: ${{ github.actor != 'dependabot[bot]' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: arc-runners-mekong
    timeout-minutes: 5
    outputs:
      message_id: ${{ steps.create-thread.outputs.message_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build main update content
        id: main-content
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          short_sha="${HEAD_SHA:0:7}"
          post_content="$(jq -cn \
            --arg short_sha "$short_sha" \
            '{
              zh_cn: {
                title: "stargate-next main 分支已更新",
                content: [[{
                  tag: "text",
                  text: "提交: \($short_sha)"
                }]]
              }
            }')"

          echo "content=$post_content" >> "$GITHUB_OUTPUT"

      - name: Create Feishu thread
        id: create-thread
        uses: ./.github/actions/feishu-send
        with:
          app_id: ${{ secrets.FEISHU_APP_ID }}
          app_secret: ${{ secrets.FEISHU_APP_SECRET }}
          chat_id: ${{ secrets.FEISHU_CHAT_ID }}
          msg_type: post
          content: ${{ steps.main-content.outputs.content }}
          uuid: main-${{ github.sha }}

  test-and-build:
    name: Test and build
    runs-on: arc-runners-mekong
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_DB: stargate-next-test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d stargate-next-test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy database migrations
        run: |
          pnpm db:migrate
          pnpm db:migrate
          pnpm --filter stargate-next seed:default-tenant
          pnpm --filter stargate-next seed:legacy-fixture
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stargate-next-test
      - name: Verify multi-tenant backfill migration
        run: pnpm --filter @repo/db verify:backfill
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stargate-next-test
      - name: Code check
        run: pnpm check
      - name: Verify Stargate service boundaries
        run: |
          ! rg -n '@repo/(db|redis)' apps/stargate-next --glob '*.ts'
          ! rg -n '@(repo/db|repo/redis|prisma|nestjs)/' packages/services/stargate/src/contracts.ts
          ! rg -n 'as unknown as TenantScope|as TenantScope' --glob '*.ts' | rg -v '^packages/services/stargate/src/service\.ts:'
          ! rg -n 'as unknown as AdminScope|as AdminScope' --glob '*.ts' | rg -v '^packages/services/stargate/src/service\.ts:'
      - name: Verify OpenAPI SDK snapshot
        run: |
          pnpm sdk:generate
          git diff --exit-code -- packages/stargate-next-sdk/src
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stargate-next-test
      - name: Stargate service integration tests
        run: pnpm --filter @repo/stargate-service test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stargate-next-test
      - name: Run Stargate Next black-box tests
        run: |
          pnpm --filter stargate-next build
          pnpm --filter stargate-next start > /tmp/stargate-next.log 2>&1 &
          stargate_pid=$!
          trap 'kill "$stargate_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if ! kill -0 "$stargate_pid" 2>/dev/null; then
              cat /tmp/stargate-next.log
              exit 1
            fi
            curl --fail --silent http://127.0.0.1:9527/health/ready && break
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:9527/health/ready; then
            cat /tmp/stargate-next.log
            exit 1
          fi
          pnpm --filter stargate-next test:api
          pnpm --filter stargate-next test:sdk
        env:
          ACCESS_TOKEN_TTL_SECONDS: "3600"
          JWT_CLOCK_TOLERANCE_SECONDS: "30"
          CAPTCHA_HMAC_SECRET: ci-captcha-hmac-secret
          CAPTCHA_TEST_CODE: ABCD
          CAPTCHA_TEST_MODE: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stargate-next-test
          NODE_ENV: test
          STARGATE_ADMIN_API_KEY: ci-admin-api-key
          STARGATE_DEPLOY_TIER: test
          STARGATE_JWT_SECRET: ci-jwt-secret
          REDIS_URL: redis://localhost:6379
          REDIS_KEY_PREFIX: "stargate-next:ci-${{ github.run_id }}:"
          REFRESH_KEY_HMAC_PRIMARY_KEY_ID: ci-primary
          REFRESH_KEY_HMAC_PRIMARY_SECRET: ci-primary-secret
          STARGATE_API_KEY: ci-service-api-key
          STARGATE_ENDPOINT: http://127.0.0.1:9527
          TENANT_API_KEY_HMAC_PRIMARY_KEY_ID: ci-tenant-key-primary
          TENANT_API_KEY_HMAC_PRIMARY_SECRET: ci-tenant-key-primary-secret

      - name: Build application artifacts
        if: github.actor != 'dependabot[bot]'
        run: pnpm build:ci --summarize
        env:
          NODE_ENV: production
          BUILD_STANDALONE: "true"
      - name: Prepare DB production runtime
        if: github.actor != 'dependabot[bot]'
        run: bash scripts/prepare-db-runtime.sh
      - name: Prepare Playground production runtime
        if: github.actor != 'dependabot[bot]'
        run: bash scripts/prepare-playground-runtime.sh
      - name: Prepare Stargate Next production runtime
        if: github.actor != 'dependabot[bot]'
        run: bash scripts/prepare-stargate-next-runtime.sh
      - name: Set up Docker Buildx
        if: github.actor != 'dependabot[bot]'
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Login to Harbor
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.HARBOR_DOMAIN }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Docker metadata for Stargate Next
        if: github.actor != 'dependabot[bot]'
        id: meta-stargate-next
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.HARBOR_DOMAIN }}/${{ env.HARBOR_PROJECT }}/stargate-next
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
      - name: Docker metadata for Playground
        if: github.actor != 'dependabot[bot]'
        id: meta-playground
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.HARBOR_DOMAIN }}/${{ env.HARBOR_PROJECT }}/playground
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
      - name: Docker metadata for DB
        if: github.actor != 'dependabot[bot]'
        id: meta-db
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.HARBOR_DOMAIN }}/${{ env.HARBOR_PROJECT }}/db
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
      - name: Compute image fingerprints
        if: github.actor != 'dependabot[bot]'
        id: image-fingerprints
        run: bash scripts/docker-image-fingerprint.sh >> "$GITHUB_OUTPUT"
      - name: Plan image builds
        if: github.actor != 'dependabot[bot]'
        id: image-plan
        env:
          STARGATE_NEXT_SHA: ${{ steps.image-fingerprints.outputs.stargate_next_sha }}
          PLAYGROUND_SHA: ${{ steps.image-fingerprints.outputs.playground_sha }}
          DB_SHA: ${{ steps.image-fingerprints.outputs.db_sha }}
          STARGATE_NEXT_META_TAGS: ${{ steps.meta-stargate-next.outputs.tags }}
          PLAYGROUND_META_TAGS: ${{ steps.meta-playground.outputs.tags }}
          DB_META_TAGS: ${{ steps.meta-db.outputs.tags }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          plan_image() {
            local bake_target="$1"
            local image_target="$2"
            local sha="$3"
            local meta_tags="$4"
            local output="$5"
            local image="${HARBOR_DOMAIN}/${HARBOR_PROJECT}/${image_target}"
            local fingerprint_tag="${image}:input-${sha}"
            local tags="${meta_tags}"$'\n'"${fingerprint_tag}"
            echo "${output}_tags<<EOF" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$tags" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "${output}_fingerprint_tag=${fingerprint_tag}" >> "$GITHUB_OUTPUT"
            if docker buildx imagetools inspect "$fingerprint_tag" >/dev/null 2>&1; then
              while IFS= read -r tag; do
                [ -z "$tag" ] || docker buildx imagetools create -t "$tag" "$fingerprint_tag"
              done <<< "$meta_tags"
              echo "${output}_status=retagged" >> "$GITHUB_OUTPUT"
            else
              echo "${output}_status=built" >> "$GITHUB_OUTPUT"
              targets+=("$bake_target")
            fi
          }
          targets=()
          plan_image "stargate-next" "stargate-next" "$STARGATE_NEXT_SHA" "$STARGATE_NEXT_META_TAGS" "stargate_next"
          plan_image "playground" "playground" "$PLAYGROUND_SHA" "$PLAYGROUND_META_TAGS" "playground"
          plan_image "db" "db" "$DB_SHA" "$DB_META_TAGS" "db"
          echo "bake_targets=$(IFS=,; echo "${targets[*]}")" >> "$GITHUB_OUTPUT"
      - name: Build and push image cache misses
        if: github.actor != 'dependabot[bot]' && steps.image-plan.outputs.bake_targets != ''
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          push: true
          targets: ${{ steps.image-plan.outputs.bake_targets }}
        env:
          STARGATE_NEXT_TAGS: ${{ steps.image-plan.outputs.stargate_next_tags }}
          PLAYGROUND_TAGS: ${{ steps.image-plan.outputs.playground_tags }}
          DB_TAGS: ${{ steps.image-plan.outputs.db_tags }}
      - name: Build summary
        if: always() && github.actor != 'dependabot[bot]'
        run: |
          {
            echo "## Image build results"
            echo
            echo "| Application | Status | Image |"
            echo "| --- | --- | --- |"
            echo "| Stargate Next | \`${{ steps.image-plan.outputs.stargate_next_status || 'not-planned' }}\` | \`${{ env.HARBOR_DOMAIN }}/${{ env.HARBOR_PROJECT }}/stargate-next:${{ steps.meta-stargate-next.outputs.version }}\` |"
            echo "| Playground | \`${{ steps.image-plan.outputs.playground_status || 'not-planned' }}\` | \`${{ env.HARBOR_DOMAIN }}/${{ env.HARBOR_PROJECT }}/playground:${{ steps.meta-playground.outputs.version }}\` |"
            echo "| DB | \`${{ steps.image-plan.outputs.db_status || 'not-planned' }}\` | \`${{ env.HARBOR_DOMAIN }}/${{ env.HARBOR_PROJECT }}/db:${{ steps.meta-db.outputs.version }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write deploy image metadata
        if: github.actor != 'dependabot[bot]'
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/deploy-images"

          write_metadata() {
            local image="$1"
            local fingerprint_tag="$2"

            if [ -z "$fingerprint_tag" ]; then
              echo "::error::Missing fingerprint tag for ${image}"
              exit 1
            fi

            local image_tag="${fingerprint_tag##*:}"

            {
              echo "image=${image}"
              echo "tag=${image_tag}"
              echo "fingerprint_tag=${fingerprint_tag}"
            } > "$RUNNER_TEMP/deploy-images/${image}.env"
          }

          write_metadata "stargate-next" "${{ steps.image-plan.outputs.stargate_next_fingerprint_tag }}"
          write_metadata "playground" "${{ steps.image-plan.outputs.playground_fingerprint_tag }}"
          write_metadata "db" "${{ steps.image-plan.outputs.db_fingerprint_tag }}"
      - name: Upload deploy image metadata
        if: github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: deploy-image-metadata
          path: ${{ runner.temp }}/deploy-images/
          retention-days: 1
          if-no-files-found: error

  build-helm-chart:
    name: Build Helm chart
    runs-on: arc-runners-mekong
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        )
      }}
    timeout-minutes: 15
    outputs:
      chart_version: ${{ steps.chart-version.outputs.chart_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.HARBOR_DOMAIN }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Compute chart fingerprint
        id: chart-fingerprint
        run: |
          set -euo pipefail

          if command -v sha256sum >/dev/null 2>&1; then
            sha256_cmd() {
              sha256sum "$@" | awk '{print $1}'
            }
          else
            sha256_cmd() {
              shasum -a 256 "$@" | awk '{print $1}'
            }
          fi

          manifest_file="$(mktemp)"

          {
            printf 'helm-chart-fingerprint-v1\n'
            git ls-files -z -- deploy/helm-chart \
              | LC_ALL=C sort -z \
              | while IFS= read -r -d '' file; do
                  printf 'file %s\n' "$file"
                  sha256_cmd "$file"
                  printf '\n'
                done
          } > "$manifest_file"

          chart_sha="$(sha256_cmd "$manifest_file")"
          rm -f "$manifest_file"

          echo "chart_sha=${chart_sha}" >> "$GITHUB_OUTPUT"

      - name: Lint Helm chart
        run: helm lint deploy/helm-chart

      - name: Resolve chart version
        id: chart-version
        env:
          CHART_SHA: ${{ steps.chart-fingerprint.outputs.chart_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            chart_version="0.0.0-pr-${PR_NUMBER}-${CHART_SHA}"
          else
            chart_version="0.0.0-main"
          fi

          echo "chart_version=${chart_version}" >> "$GITHUB_OUTPUT"

      - name: Package and push Helm chart
        run: |
          set -euo pipefail

          chart_dir="deploy/helm-chart"
          destination="${RUNNER_TEMP}/helm-chart"
          fingerprint_version="0.0.0-input-${CHART_SHA}"
          repository="oci://${HARBOR_DOMAIN}/${HARBOR_PROJECT}"

          mkdir -p "$destination"

          helm package "$chart_dir" --version "$CHART_VERSION" --destination "$destination"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$PR_NUMBER" = "42" ]; then
            rendered_file="${RUNNER_TEMP}/ticket-232-preview-chart.yaml"
            api_key="ticket-232-preview-api-key"
            refresh_secret="ticket-232-preview-refresh-secret"
            expected_admin_key="$(printf 'stargate-next-pr-admin:%s' "$api_key" | sha256sum | awk '{print $1}')"
            expected_tenant_secret="$(printf 'stargate-next-pr-tenant-api-key:%s' "$refresh_secret" | sha256sum | awk '{print $1}')"
            expected_captcha_code="$(printf 'stargate-next-pr-captcha:%s' "$api_key" | sha256sum | awk '{print toupper(substr($1, 1, 4))}')"

            helm template stargate-next "${destination}/stargate-chart-${CHART_VERSION}.tgz" \
              --set-string stargateNext.secrets.stargateApiKey="$api_key" \
              --set-string stargateNext.secrets.refreshKeyHmacPrimaryKeyId=ticket-232-preview-refresh \
              --set-string stargateNext.secrets.refreshKeyHmacPrimarySecret="$refresh_secret" \
              > "$rendered_file"

            grep -Fq "STARGATE_ADMIN_API_KEY: \"${expected_admin_key}\"" "$rendered_file"
            grep -Fq 'TENANT_API_KEY_HMAC_PRIMARY_KEY_ID: "ticket-232-preview-primary"' "$rendered_file"
            grep -Fq "TENANT_API_KEY_HMAC_PRIMARY_SECRET: \"${expected_tenant_secret}\"" "$rendered_file"
            grep -Fq 'STARGATE_DEPLOY_TIER: "preview"' "$rendered_file"
            grep -Fq 'CAPTCHA_TEST_MODE: "true"' "$rendered_file"
            grep -Fq "CAPTCHA_TEST_CODE: \"${expected_captcha_code}\"" "$rendered_file"
          fi

          helm push "${destination}/stargate-chart-${CHART_VERSION}.tgz" "$repository"

          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            helm package "$chart_dir" --version "$fingerprint_version" --destination "$destination"
            helm push "${destination}/stargate-chart-${fingerprint_version}.tgz" "$repository"
          fi
        env:
          CHART_SHA: ${{ steps.chart-fingerprint.outputs.chart_sha }}
          CHART_VERSION: ${{ steps.chart-version.outputs.chart_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  deploy:
    name: Deploy
    needs: [test-and-build, build-helm-chart]
    if: >-
      ${{
        always() &&
        github.actor != 'dependabot[bot]' &&
        (
          github.event_name == 'pull_request' ||
          (
            github.ref == 'refs/heads/main' &&
            (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          )
        ) &&
        needs['test-and-build'].result == 'success' &&
        needs['build-helm-chart'].result == 'success'
      }}
    runs-on: arc-runners-mekong
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Download deploy image metadata
        uses: actions/download-artifact@v8
        with:
          name: deploy-image-metadata
          path: ${{ runner.temp }}/deploy-images

      - name: Resolve deploy context
        id: deploy-context
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            deploy_name="pr-${{ github.event.pull_request.number }}"
            url_scheme="http"
          else
            deploy_name="uat"
            url_scheme="https"
          fi

          app_id="stargate-next-${deploy_name}"
          domain="stargate-next-${deploy_name}.36node.com"

          echo "deploy_name=${deploy_name}" >> "$GITHUB_OUTPUT"
          echo "app_id=${app_id}" >> "$GITHUB_OUTPUT"
          echo "domain=${domain}" >> "$GITHUB_OUTPUT"
          echo "api_url=${url_scheme}://api.${domain}" >> "$GITHUB_OUTPUT"
          echo "playground_url=${url_scheme}://playground.${domain}" >> "$GITHUB_OUTPUT"

      - name: Extract env from PR body
        if: github.event_name == 'pull_request'
        id: pr-env
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const body = process.env.PR_BODY || '';
          const envs = {};

          for (const line of body.split(/\r?\n/)) {
            const match = line.match(/^\s*\+env:([A-Za-z_][A-Za-z0-9_]*)=(.*)\s*$/);
            if (match) {
              envs[match[1]] = match[2];
            }
          }

          console.log(`env=${JSON.stringify(envs)}`);
          NODE

      - name: Read deploy image tags
        id: deploy-images
        run: |
          set -euo pipefail

          metadata_dir="$RUNNER_TEMP/deploy-images"

          read_tag() {
            local image="$1"
            local file="${metadata_dir}/${image}.env"

            if [ ! -f "$file" ]; then
              echo "::error::Missing deploy metadata for ${image}"
              exit 1
            fi

            node - "$file" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          const tagLine = fs.readFileSync(file, 'utf8')
            .split(/\r?\n/)
            .find((line) => line.startsWith('tag='));

          if (!tagLine) {
            console.error(`Missing tag in ${file}`);
            process.exit(1);
          }

          process.stdout.write(tagLine.slice('tag='.length));
          NODE
          }

          echo "stargate_next_tag=$(read_tag stargate-next)" >> "$GITHUB_OUTPUT"
          echo "playground_tag=$(read_tag playground)" >> "$GITHUB_OUTPUT"
          echo "db_tag=$(read_tag db)" >> "$GITHUB_OUTPUT"

      - name: Upsert Stargate Next app settings
        env:
          DEPLOY_NAME: ${{ steps.deploy-context.outputs.deploy_name }}
          APP_ID: ${{ steps.deploy-context.outputs.app_id }}
          PR_ENV_JSON: ${{ steps.pr-env.outputs.env || '{}' }}
          CYCLOPS_CI_RUNNER_API_TOKEN: ${{ secrets.CYCLOPS_CI_RUNNER_API_TOKEN }}
        run: |
          set -euo pipefail

          deploy_upper="$(echo "$DEPLOY_NAME" | tr '[:lower:]' '[:upper:]')"

          sed -e "s/{{deploy}}/${DEPLOY_NAME}/g" \
              -e "s/{{deploy *| *uppercase}}/${deploy_upper}/g" \
            .github/workflows/stargate-next-app-settings.json > /tmp/app-settings.json

          jq --argjson envs "$PR_ENV_JSON" \
            '.playbook.extraVars += ($envs | with_entries(.value = {default: (.value | tostring), overridable: true}))' \
            /tmp/app-settings.json > /tmp/app-settings.final.json

          http_code="$(curl -sS -o /tmp/upsert-response.json -w '%{http_code}' \
            -X PUT "$CYCLOPS_BASE_URL/api/settings/applications/$APP_ID" \
            -H "Authorization: Bearer $CYCLOPS_CI_RUNNER_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/app-settings.final.json)"

          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            cat /tmp/upsert-response.json
            echo "::error::Upsert app settings failed with HTTP $http_code"
            exit 1
          fi

          echo "App settings $APP_ID upserted (HTTP $http_code)"

      - name: Deploy
        id: deploy
        env:
          APP_ID: ${{ steps.deploy-context.outputs.app_id }}
          CYCLOPS_CI_RUNNER_API_TOKEN: ${{ secrets.CYCLOPS_CI_RUNNER_API_TOKEN }}
          STARGATE_NEXT_TAG: ${{ steps.deploy-images.outputs.stargate_next_tag }}
          PLAYGROUND_TAG: ${{ steps.deploy-images.outputs.playground_tag }}
          DB_TAG: ${{ steps.deploy-images.outputs.db_tag }}
          STARGATE_CHART_VERSION: ${{ needs.build-helm-chart.outputs.chart_version }}
        run: |
          set -euo pipefail

          fail() {
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 1
          }

          http_code="$(curl -sS -o /tmp/hooks.json -w '%{http_code}' \
            "$CYCLOPS_BASE_URL/api/settings/applications/$APP_ID/hooks" \
            -H "Authorization: Bearer $CYCLOPS_CI_RUNNER_API_TOKEN")"

          if [ "$http_code" != "200" ]; then
            cat /tmp/hooks.json
            fail "Get webhook token failed with HTTP $http_code"
          fi

          token="$(jq -r '.token' /tmp/hooks.json)"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            fail "Webhook token missing in hooks response"
          fi
          echo "::add-mask::$token"

          jq -n \
            --arg stargate_next "$STARGATE_NEXT_TAG" \
            --arg playground "$PLAYGROUND_TAG" \
            --arg db "$DB_TAG" \
            --arg chart_version "$STARGATE_CHART_VERSION" \
            '{
              overrides: {
                stargate_next_tag: $stargate_next,
                stargate_next_playground_tag: $playground,
                stargate_next_db_tag: $db,
                stargate_next_chart_version: $chart_version
              }
            }' > /tmp/deploy-overrides.json

          http_code="$(curl -sS -o /tmp/deploy-trigger.json -w '%{http_code}' \
            -X POST "$CYCLOPS_BASE_URL/api/hooks/$token/deploy" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/deploy-overrides.json)"

          if [ "$http_code" != "202" ]; then
            cat /tmp/deploy-trigger.json
            fail "Trigger deploy failed with HTTP $http_code"
          fi

          task_id="$(jq -r '.task.id' /tmp/deploy-trigger.json)"
          if [ -z "$task_id" ] || [ "$task_id" = "null" ]; then
            fail "Task id missing in deploy trigger response"
          fi

          status_url="$CYCLOPS_BASE_URL/api/hooks/$token/tasks/$task_id"
          logs_url="$status_url/logs"

          echo "Streaming deploy logs for task $task_id"
          timeout 1500 curl -NsS "$logs_url" | {
            current=""
            while IFS= read -r line; do
              case "$line" in
                "event: "*) current="${line#event: }" ;;
                "data: "*)  if [ "$current" = "log" ]; then printf '%s\n' "${line#data: }"; fi ;;
                "data:"*)   if [ "$current" = "log" ]; then printf '%s\n' "${line#data:}"; fi ;;
              esac
            done
          } || echo "::warning::Log stream ended unexpectedly"

          status=""
          for _ in $(seq 1 60); do
            status="$(curl -fsS "$status_url" | jq -r '.status' || echo '')"
            case "$status" in
              SUCCEEDED|ERROR) break ;;
            esac
            echo "Task status: ${status:-unknown}; waiting..."
            sleep 10
          done

          if [ "$status" = "SUCCEEDED" ]; then
            echo "Deploy task $task_id succeeded"
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            fail "Deploy task $task_id finished with status: ${status:-unknown}"
          fi

      - name: Seed tenants and init accounts
        if: ${{ steps.deploy.outputs.outcome == 'success' }}
        run: |
          set -euo pipefail

          require_secret() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "::error::$name is required for seed"
              exit 1
            fi
            echo "::add-mask::$value"
          }

          api_curl() {
            curl --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 "$@"
          }

          require_secret STARGATE_API_KEY "$STARGATE_API_KEY"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$PR_NUMBER" = "42" ]; then
            # TODO(ticket-232): remove with the PR #42 Chart compatibility bootstrap.
            STARGATE_ADMIN_API_KEY="$(printf 'stargate-next-pr-admin:%s' "$STARGATE_API_KEY" | sha256sum | awk '{print $1}')"
            SEED_PASSWORD="$(printf 'stargate-next-pr-seed-password:%s' "$STARGATE_API_KEY" | sha256sum | awk '{print $1}')"
          fi

          require_secret STARGATE_ADMIN_API_KEY "$STARGATE_ADMIN_API_KEY"
          require_secret SEED_PASSWORD "$SEED_PASSWORD"

          API_URL="${{ steps.deploy-context.outputs.api_url }}"
          echo "Waiting for API to be ready at $API_URL/health/ready"
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/health/ready" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          if ! curl -fsS "$API_URL/health/ready" >/dev/null 2>&1; then
            echo "::error::API health check failed after deploy"
            exit 1
          fi

          ensure_tenant() {
            response_file="$(mktemp)"
            status="$(api_curl -sS -o "$response_file" -w '%{http_code}' \
              -X POST "$API_URL/v1/tenants" \
              -H "x-api-key: $STARGATE_ADMIN_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"id":"test","name":"test"}')"
            if [ "$status" = "201" ]; then
              rm -f "$response_file"
              return
            fi
            if [ "$status" != "409" ] || [ "$(jq -r '.code // empty' "$response_file")" != "TENANT_ALREADY_EXISTS" ]; then
              cat "$response_file"
              rm -f "$response_file"
              echo "::error::Ensure test tenant failed with HTTP $status"
              exit 1
            fi

            status="$(api_curl -sS -o "$response_file" -w '%{http_code}' \
              "$API_URL/v1/tenants/test" \
              -H "x-api-key: $STARGATE_ADMIN_API_KEY")"
            if [ "$status" != "200" ]; then
              cat "$response_file"
              rm -f "$response_file"
              echo "::error::Read test tenant failed with HTTP $status"
              exit 1
            fi
            tenant_status="$(jq -r '.status // empty' "$response_file")"
            if [ "$tenant_status" = "active" ]; then
              rm -f "$response_file"
              return
            fi
            if [ "$tenant_status" != "disabled" ]; then
              cat "$response_file"
              rm -f "$response_file"
              echo "::error::Unexpected test tenant status: $tenant_status"
              exit 1
            fi
            status="$(api_curl -sS -o "$response_file" -w '%{http_code}' \
              -X PATCH "$API_URL/v1/tenants/test" \
              -H "x-api-key: $STARGATE_ADMIN_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"status":"active"}')"
            if [ "$status" != "200" ] || [ "$(jq -r '.status // empty' "$response_file")" != "active" ]; then
              cat "$response_file"
              rm -f "$response_file"
              echo "::error::Enable test tenant failed with HTTP $status"
              exit 1
            fi
            rm -f "$response_file"
          }

          ensure_account() {
            tenant="$1"
            key="$2"
            include_tenant_header="$3"
            response_file="$(mktemp)"
            tenant_args=()
            if [ "$include_tenant_header" = "true" ]; then
              tenant_args=(-H "x-tenant-id: $tenant")
            fi
            payload="$(jq -cn --arg password "$SEED_PASSWORD" '{active:true,password:$password,username:"stargate"}')"
            status="$(api_curl -sS -o "$response_file" -w '%{http_code}' \
              -X POST "$API_URL/v1/accounts" \
              -H "x-api-key: $key" \
              "${tenant_args[@]}" \
              -H "Content-Type: application/json" \
              -d "$payload")"
            if [ "$status" = "201" ]; then
              rm -f "$response_file"
              return
            fi
            if [ "$status" != "409" ] || [ "$(jq -r '.code // empty' "$response_file")" != "ACCOUNT_IDENTIFIER_CONFLICT" ]; then
              cat "$response_file"
              rm -f "$response_file"
              echo "::error::Ensure $tenant account failed with HTTP $status"
              exit 1
            fi

            account_id=""
            for page in $(seq 0 19); do
              offset="$((page * 100))"
              status="$(api_curl --globoff -sS -o "$response_file" -w '%{http_code}' \
                "$API_URL/v1/accounts?page[offset]=$offset&page[limit]=100" \
                -H "x-api-key: $key" \
                "${tenant_args[@]}")"
              if [ "$status" != "200" ]; then
                cat "$response_file"
                rm -f "$response_file"
                echo "::error::List $tenant accounts failed with HTTP $status"
                exit 1
              fi
              account_id="$(jq -r '.data[] | select(.attributes.username == "stargate") | .id' "$response_file" | head -n 1)"
              [ -n "$account_id" ] && break
              [ "$(jq -r '.links.next // empty' "$response_file")" = "" ] && break
            done
            if [ -z "$account_id" ]; then
              rm -f "$response_file"
              echo "::error::Existing stargate account was not found in $tenant"
              exit 1
            fi

            status="$(api_curl -sS -o "$response_file" -w '%{http_code}' \
              -X PATCH "$API_URL/v1/accounts/$account_id" \
              -H "x-api-key: $key" \
              "${tenant_args[@]}" \
              -H "Content-Type: application/json" \
              -d '{"active":true}')"
            if [ "$status" != "200" ]; then
              cat "$response_file"
              rm -f "$response_file"
              echo "::error::Enable $tenant account failed with HTTP $status"
              exit 1
            fi
            status="$(api_curl -sS -o "$response_file" -w '%{http_code}' \
              -X POST "$API_URL/v1/accounts/$account_id/password" \
              -H "x-api-key: $key" \
              "${tenant_args[@]}" \
              -H "Content-Type: application/json" \
              -d "$(jq -cn --arg password "$SEED_PASSWORD" '{password:$password}')")"
            if [ "$status" != "204" ]; then
              cat "$response_file"
              rm -f "$response_file"
              echo "::error::Reset $tenant account password failed with HTTP $status"
              exit 1
            fi
            rm -f "$response_file"
          }

          ensure_tenant
          ensure_account default "$STARGATE_API_KEY" false
          ensure_account test "$STARGATE_ADMIN_API_KEY" true
          echo "Default and test tenant accounts converged"
        env:
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
          STARGATE_ADMIN_API_KEY: ${{ secrets.STARGATE_ADMIN_API_KEY }}
          STARGATE_API_KEY: ${{ secrets.STARGATE_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: "Preview smoke: dual tenant"
        if: ${{ steps.deploy.outputs.outcome == 'success' }}
        run: |
          set -euo pipefail

          require_value() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              if [ "$name" = "CAPTCHA_TEST_CODE" ]; then
                echo "::error::CAPTCHA_TEST_CODE is required. Preview/UAT must configure STARGATE_DEPLOY_TIER + CAPTCHA_TEST_MODE + CAPTCHA_TEST_CODE, and store the same value in GitHub secret PREVIEW_CAPTCHA_TEST_CODE"
              else
                echo "::error::$name is required for Preview dual-tenant smoke"
              fi
              exit 1
            fi
          }

          api_curl() {
            curl --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 "$@"
          }

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$PR_NUMBER" = "42" ]; then
            # TODO(ticket-232): remove with the PR #42 Chart compatibility bootstrap.
            require_value STARGATE_API_KEY "$STARGATE_API_KEY"
            STARGATE_ADMIN_API_KEY="$(printf 'stargate-next-pr-admin:%s' "$STARGATE_API_KEY" | sha256sum | awk '{print $1}')"
            CAPTCHA_TEST_CODE="$(printf 'stargate-next-pr-captcha:%s' "$STARGATE_API_KEY" | sha256sum | awk '{print toupper(substr($1, 1, 4))}')"
            SEED_PASSWORD="$(printf 'stargate-next-pr-seed-password:%s' "$STARGATE_API_KEY" | sha256sum | awk '{print $1}')"
          fi

          require_value API_URL "$API_URL"
          # Admin Key 由前置 seed 使用；此处保留检查以确认 workflow 与 Pod Secret 已就绪。
          require_value STARGATE_ADMIN_API_KEY "$STARGATE_ADMIN_API_KEY"
          require_value SEED_PASSWORD "$SEED_PASSWORD"
          require_value CAPTCHA_TEST_CODE "$CAPTCHA_TEST_CODE"
          echo "::add-mask::$STARGATE_ADMIN_API_KEY"
          echo "::add-mask::$SEED_PASSWORD"
          echo "::add-mask::$CAPTCHA_TEST_CODE"

          if ! api_curl -fsS "$API_URL/health/ready" >/dev/null 2>&1; then
            echo "::error::Preview API readiness check failed"
            exit 1
          fi

          captcha_response="$(mktemp)"
          login_response="$(mktemp)"
          refresh_response="$(mktemp)"
          isolation_response="$(mktemp)"
          trap 'rm -f "$captcha_response" "$login_response" "$refresh_response" "$isolation_response"' EXIT

          fail_response() {
            local context="$1"
            local status="$2"
            local response_file="$3"
            local code
            code="$(jq -r '.code // empty' "$response_file" 2>/dev/null || true)"
            echo "::error::$context failed with HTTP $status${code:+ code=$code}"
            exit 1
          }

          decode_token_tid() {
            local token="$1"
            local encoded
            encoded="${token#*.}"
            encoded="${encoded%%.*}"
            case "$((${#encoded} % 4))" in
              0) ;;
              2) encoded="${encoded}==" ;;
              3) encoded="${encoded}=" ;;
              *) return 1 ;;
            esac
            printf '%s' "$encoded" | tr '_-' '/+' | base64 --decode 2>/dev/null | jq -r '.tid // empty' 2>/dev/null
          }

          login_tenant() {
            local tenant="$1"
            local captcha_status
            local login_status
            local captcha_id
            local account_id
            local access_token
            local login_payload
            local refresh_key
            local token_tid

            if [ "$tenant" = "test" ]; then
              captcha_status="$(api_curl -sS -o "$captcha_response" -w '%{http_code}' -X POST "$API_URL/v1/captchas" -H "x-tenant-id: test")"
            else
              captcha_status="$(api_curl -sS -o "$captcha_response" -w '%{http_code}' -X POST "$API_URL/v1/captchas")"
            fi
            if [ "$captcha_status" != "201" ]; then
              fail_response "Create $tenant captcha" "$captcha_status" "$captcha_response"
            fi
            captcha_id="$(jq -r '.id // empty' "$captcha_response")"
            if [ -z "$captcha_id" ]; then
              echo "::error::Create $tenant captcha returned no id"
              exit 1
            fi

            login_payload="$(jq -cn --arg captchaCode "$CAPTCHA_TEST_CODE" --arg captchaId "$captcha_id" --arg login "stargate" --arg password "$SEED_PASSWORD" '{captchaCode:$captchaCode,captchaId:$captchaId,login:$login,password:$password}')"
            if [ "$tenant" = "test" ]; then
              login_status="$(api_curl -sS -o "$login_response" -w '%{http_code}' -X POST "$API_URL/v1/auth/login" -H "x-tenant-id: test" -H "Content-Type: application/json" -d "$login_payload")"
            else
              login_status="$(api_curl -sS -o "$login_response" -w '%{http_code}' -X POST "$API_URL/v1/auth/login" -H "Content-Type: application/json" -d "$login_payload")"
            fi
            if [ "$login_status" != "200" ]; then
              fail_response "Login $tenant account" "$login_status" "$login_response"
            fi

            account_id="$(jq -r '.accountId // empty' "$login_response")"
            access_token="$(jq -r '.accessToken // empty' "$login_response")"
            refresh_key="$(jq -r '.refreshKey // empty' "$login_response")"
            if [ -z "$account_id" ] || [ -z "$access_token" ] || [ -z "$refresh_key" ]; then
              echo "::error::Login $tenant account returned an incomplete token set"
              exit 1
            fi
            echo "::add-mask::$access_token"
            echo "::add-mask::$refresh_key"
            token_tid="$(decode_token_tid "$access_token" || true)"
            if [ "$token_tid" != "$tenant" ]; then
              echo "::error::Login $tenant account returned an unexpected JWT tenant claim"
              exit 1
            fi

            if [ "$tenant" = "default" ]; then
              default_account_id="$account_id"
              default_refresh_key="$refresh_key"
            else
              test_account_id="$account_id"
            fi
          }

          default_account_id=""
          default_refresh_key=""
          test_account_id=""
          login_tenant default
          login_tenant test

          if [ "$default_account_id" = "$test_account_id" ]; then
            echo "::error::Default and test tenant logins resolved to the same account"
            exit 1
          fi

          refresh_status="$(api_curl -sS -o "$refresh_response" -w '%{http_code}' -X POST "$API_URL/v1/auth/refresh" -H "x-tenant-id: test" -H "Content-Type: application/json" -d "$(jq -cn --arg refreshKey "$default_refresh_key" '{refreshKey:$refreshKey}')")"
          if [ "$refresh_status" != "401" ] || [ "$(jq -r '.code // empty' "$refresh_response")" != "REFRESH_INVALID" ]; then
            fail_response "Cross-tenant refresh rejection" "$refresh_status" "$refresh_response"
          fi

          captcha_status="$(api_curl -sS -o "$captcha_response" -w '%{http_code}' -X POST "$API_URL/v1/captchas" -H "x-tenant-id: test")"
          if [ "$captcha_status" != "201" ]; then
            fail_response "Create fresh test captcha" "$captcha_status" "$captcha_response"
          fi
          test_captcha_id="$(jq -r '.id // empty' "$captcha_response")"
          if [ -z "$test_captcha_id" ]; then
            echo "::error::Fresh test captcha returned no id"
            exit 1
          fi
          isolation_status="$(api_curl -sS -o "$isolation_response" -w '%{http_code}' -X POST "$API_URL/v1/auth/login" -H "Content-Type: application/json" -d "$(jq -cn --arg captchaCode "$CAPTCHA_TEST_CODE" --arg captchaId "$test_captcha_id" --arg login "stargate" --arg password "$SEED_PASSWORD" '{captchaCode:$captchaCode,captchaId:$captchaId,login:$login,password:$password}')")"
          if [ "$isolation_status" != "401" ]; then
            fail_response "Cross-tenant captcha rejection" "$isolation_status" "$isolation_response"
          fi

          echo "Preview dual-tenant smoke passed"
        env:
          API_URL: ${{ steps.deploy-context.outputs.api_url }}
          STARGATE_ADMIN_API_KEY: ${{ secrets.STARGATE_ADMIN_API_KEY }}
          STARGATE_API_KEY: ${{ secrets.STARGATE_API_KEY }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
          CAPTCHA_TEST_CODE: ${{ secrets.PREVIEW_CAPTCHA_TEST_CODE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Comment PR deploy URLs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          API_URL: ${{ steps.deploy-context.outputs.api_url }}
          PLAYGROUND_URL: ${{ steps.deploy-context.outputs.playground_url }}
        with:
          script: |
            const deployMarker = '<!-- stargate-next-deploy-urls -->';
            const feishuMarker = '<!-- feishu_message_id:';

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => (
              comment.user?.type === 'Bot' &&
              (
                comment.body?.includes(deployMarker) ||
                comment.body?.includes(feishuMarker)
              )
            ));
            const feishuMatch = existing?.body?.match(/<!-- feishu_message_id: ([\w-]+) -->/);
            const body = [
              feishuMatch?.[0],
              deployMarker,
              '访问地址:',
              '',
              `* API: ${process.env.API_URL}`,
              `* Playground: ${process.env.PLAYGROUND_URL}`,
            ].filter(Boolean).join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  notify-feishu-deploy:
    name: Notify Feishu PR deploy
    needs: [deploy]
    if: >-
      ${{
        always() &&
        github.event_name == 'pull_request' &&
        github.actor != 'dependabot[bot]' &&
        needs.deploy.result == 'success'
      }}
    runs-on: arc-runners-mekong
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Get Feishu message ID from PR comments
        id: pr-comments
        uses: ./.github/actions/pr-comment-data
        with:
          pattern: '<!-- feishu_message_id: ([\w-]+) -->'

      - name: Build deploy notification content
        if: steps.pr-comments.outputs.found == 'true'
        id: notify-content
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          API_URL: http://api.stargate-next-pr-${{ github.event.pull_request.number }}.36node.com
          PLAYGROUND_URL: http://playground.stargate-next-pr-${{ github.event.pull_request.number }}.36node.com
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          short_sha="${HEAD_SHA:0:7}"
          {
            echo 'content<<EOF'
            printf 'PR #%s 部署成功（Commit: %s）\n' "$PR_NUMBER" "$short_sha"
            printf '\n'
            printf '访问地址：\n'
            printf -- '- API：%s\n' "$API_URL"
            printf -- '- Playground：%s\n' "$PLAYGROUND_URL"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Reply Feishu thread
        if: steps.pr-comments.outputs.found == 'true'
        uses: ./.github/actions/feishu-reply
        with:
          app_id: ${{ secrets.FEISHU_APP_ID }}
          app_secret: ${{ secrets.FEISHU_APP_SECRET }}
          message_id: ${{ steps.pr-comments.outputs.value }}
          content: ${{ steps.notify-content.outputs.content }}

      - name: Skip missing Feishu thread
        if: steps.pr-comments.outputs.found != 'true'
        run: |
          echo "::warning::Feishu message ID marker was not found; skipping deploy notification."

  notify-feishu-uat-deploy:
    name: Notify Feishu UAT deploy
    needs: [notify-main-updated, deploy]
    if: >-
      ${{
        always() &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor != 'dependabot[bot]' &&
        needs['notify-main-updated'].result == 'success' &&
        needs['notify-main-updated'].outputs.message_id != '' &&
        needs.deploy.result != 'skipped' &&
        needs.deploy.result != 'cancelled'
      }}
    runs-on: arc-runners-mekong
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Build UAT deploy notification content
        id: notify-content
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          API_URL: https://api.stargate-next-uat.36node.com
          PLAYGROUND_URL: https://playground.stargate-next-uat.36node.com
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          short_sha="${HEAD_SHA:0:7}"
          {
            echo 'content<<EOF'
            if [ "$DEPLOY_RESULT" = "success" ]; then
              printf 'UAT 部署成功（Commit: %s）\n' "$short_sha"
              printf '\n'
              printf '访问地址：\n'
              printf -- '- API：%s\n' "$API_URL"
              printf -- '- Playground：%s\n' "$PLAYGROUND_URL"
            else
              printf 'UAT 部署失败（Commit: %s）\n' "$short_sha"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Reply Feishu thread
        uses: ./.github/actions/feishu-reply
        with:
          app_id: ${{ secrets.FEISHU_APP_ID }}
          app_secret: ${{ secrets.FEISHU_APP_SECRET }}
          message_id: ${{ needs['notify-main-updated'].outputs.message_id }}
          content: ${{ steps.notify-content.outputs.content }}
