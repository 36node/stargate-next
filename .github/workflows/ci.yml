name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main, "milestone/*", "release/*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HARBOR_DOMAIN: harbor.36node.com
  HARBOR_PROJECT: stargate

jobs:
  test:
    runs-on: arc-runners-haivivi
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_DB: stargate-next-test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d stargate-next-test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy database migrations
        run: |
          pnpm db:migrate
          pnpm db:migrate
          pnpm --filter stargate-next seed:legacy-fixture
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stargate-next-test
      - name: Code check
        run: pnpm check
      - name: Verify Stargate service boundaries
        run: |
          ! rg -n '@repo/(db|redis)' apps/stargate-next --glob '*.ts'
          ! rg -n '@(repo/db|repo/redis|prisma|nestjs)/' packages/services/stargate/src/contracts.ts
      - name: Verify OpenAPI SDK snapshot
        run: |
          pnpm sdk:generate
          git diff --exit-code -- packages/stargate-next-sdk/src
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stargate-next-test
      - name: Run Stargate Next black-box tests
        run: |
          pnpm --filter stargate-next build
          pnpm --filter stargate-next start > /tmp/stargate-next.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail http://127.0.0.1:9527/health/ready && break
            sleep 1
          done
          curl --fail http://127.0.0.1:9527/health/ready
          pnpm --filter stargate-next test:api
          pnpm --filter stargate-next test:sdk
        env:
          ACCESS_TOKEN_TTL_SECONDS: "3600"
          CAPTCHA_HMAC_SECRET: ci-captcha-hmac-secret
          CAPTCHA_TEST_CODE: ABCD
          CAPTCHA_TEST_MODE: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stargate-next-test
          STARGATE_JWT_SECRET: ci-jwt-secret
          REDIS_URL: redis://localhost:6379
          REDIS_KEY_PREFIX: stargate-next:ci-${{ github.run_id }}:
          REFRESH_KEY_HMAC_PRIMARY_KEY_ID: ci-primary
          REFRESH_KEY_HMAC_PRIMARY_SECRET: ci-primary-secret
          STARGATE_API_KEY: ci-service-api-key
          STARGATE_ENDPOINT: http://127.0.0.1:9527

  docker:
    if: github.actor != 'dependabot[bot]'
    runs-on: arc-runners-haivivi
    timeout-minutes: 30
    outputs:
      stargate_next_image_tag: input-${{ steps.image-fingerprints.outputs.stargate_next_sha }}
      playground_image_tag: input-${{ steps.image-fingerprints.outputs.playground_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:ci --summarize
        env:
          NODE_ENV: production
          BUILD_STANDALONE: "true"
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_DOMAIN }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Docker metadata for Stargate Next
        id: meta-stargate-next
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.HARBOR_DOMAIN }}/${{ env.HARBOR_PROJECT }}/stargate-next
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
      - name: Docker metadata for Playground
        id: meta-playground
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.HARBOR_DOMAIN }}/${{ env.HARBOR_PROJECT }}/playground
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
      - name: Compute image fingerprints
        id: image-fingerprints
        run: bash scripts/docker-image-fingerprint.sh >> "$GITHUB_OUTPUT"
      - name: Plan image builds
        id: image-plan
        env:
          STARGATE_NEXT_SHA: ${{ steps.image-fingerprints.outputs.stargate_next_sha }}
          PLAYGROUND_SHA: ${{ steps.image-fingerprints.outputs.playground_sha }}
          STARGATE_NEXT_META_TAGS: ${{ steps.meta-stargate-next.outputs.tags }}
          PLAYGROUND_META_TAGS: ${{ steps.meta-playground.outputs.tags }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          plan_image() {
            local bake_target="$1"
            local image_target="$2"
            local sha="$3"
            local meta_tags="$4"
            local output="$5"
            local image="${HARBOR_DOMAIN}/${HARBOR_PROJECT}/${image_target}"
            local fingerprint_tag="${image}:input-${sha}"
            local tags="${meta_tags}"$'\n'"${fingerprint_tag}"
            echo "${output}_tags<<EOF" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$tags" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            if docker buildx imagetools inspect "$fingerprint_tag" >/dev/null 2>&1; then
              while IFS= read -r tag; do
                [ -z "$tag" ] || docker buildx imagetools create -t "$tag" "$fingerprint_tag"
              done <<< "$meta_tags"
              echo "${output}_status=retagged" >> "$GITHUB_OUTPUT"
            else
              echo "${output}_status=built" >> "$GITHUB_OUTPUT"
              targets+=("$bake_target")
            fi
          }
          targets=()
          plan_image "stargate-next" "stargate-next" "$STARGATE_NEXT_SHA" "$STARGATE_NEXT_META_TAGS" "stargate_next"
          plan_image "playground" "playground" "$PLAYGROUND_SHA" "$PLAYGROUND_META_TAGS" "playground"
          echo "bake_targets=$(IFS=,; echo "${targets[*]}")" >> "$GITHUB_OUTPUT"
      - name: Build and push cache misses
        if: steps.image-plan.outputs.bake_targets != ''
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-bake.hcl
          push: true
          targets: ${{ steps.image-plan.outputs.bake_targets }}
        env:
          STARGATE_NEXT_TAGS: ${{ steps.image-plan.outputs.stargate_next_tags }}
          PLAYGROUND_TAGS: ${{ steps.image-plan.outputs.playground_tags }}
      - name: Build summary
        if: always()
        run: |
          {
            echo "## Image build results"
            echo
            echo "| Application | Status | Image |"
            echo "| --- | --- | --- |"
            echo "| Stargate Next | \`${{ steps.image-plan.outputs.stargate_next_status || 'not-planned' }}\` | \`${{ env.HARBOR_DOMAIN }}/${{ env.HARBOR_PROJECT }}/stargate-next:${{ steps.meta-stargate-next.outputs.version }}\` |"
            echo "| Playground | \`${{ steps.image-plan.outputs.playground_status || 'not-planned' }}\` | \`${{ env.HARBOR_DOMAIN }}/${{ env.HARBOR_PROJECT }}/playground:${{ steps.meta-playground.outputs.version }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [test, docker]
    if: ${{ always() && github.actor != 'dependabot[bot]' && needs.test.result != 'cancelled' && needs.docker.result != 'cancelled' }}
    runs-on: arc-runners-haivivi
    steps:
      - uses: actions/checkout@v6
      - name: Build notification content
        id: notify
        uses: ./.github/actions/ci-notify-content
        with:
          build_result: ${{ (needs.test.result == 'success' && needs.docker.result == 'success') && 'success' || 'failure' }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Send UAT notification
        if: ${{ github.event_name == 'push' }}
        uses: ./.github/actions/feishu-send
        with:
          app_id: ${{ secrets.FEISHU_APP_ID }}
          app_secret: ${{ secrets.FEISHU_APP_SECRET }}
          chat_id: ${{ secrets.FEISHU_CHAT_ID }}
          msg_type: text
          content: ${{ steps.notify.outputs.content }}
      - name: Comment pull request
        if: ${{ github.event_name == 'pull_request' }}
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: ${{ steps.notify.outputs.content }}
          comment-tag: ci-results
