name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REGISTRY_PROVIDER: ${{ vars.IMAGE_REGISTRY_PROVIDER || 'harbor' }}

jobs:
  registry-config:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.registry.outputs.registry }}
      stargate_next_image: ${{ steps.registry.outputs.stargate_next_image }}
      playground_image: ${{ steps.registry.outputs.playground_image }}
      db_image: ${{ steps.registry.outputs.db_image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Resolve image registry
        id: registry
        run: bash scripts/resolve-image-registry.sh

  release-please:
    needs: registry-config
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      stargate_next_released: ${{ steps.release.outputs['apps/stargate-next--release_created'] }}
      stargate_next_tag: ${{ steps.release.outputs['apps/stargate-next--tag_name'] }}
      playground_released: ${{ steps.release.outputs['apps/playground--release_created'] }}
      playground_tag: ${{ steps.release.outputs['apps/playground--tag_name'] }}
      db_released: ${{ steps.release.outputs['packages/db--release_created'] }}
      db_tag: ${{ steps.release.outputs['packages/db--tag_name'] }}
      sdk_released: ${{ steps.release.outputs['packages/stargate-next-sdk--release_created'] }}
      sdk_tag: ${{ steps.release.outputs['packages/stargate-next-sdk--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    needs: [registry-config, release-please]
    if: ${{ needs['release-please'].outputs.stargate_next_released == 'true' || needs['release-please'].outputs.playground_released == 'true' || needs['release-please'].outputs.db_released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:ci --summarize
        env:
          NODE_ENV: production
          BUILD_STANDALONE: "true"
      - name: Prepare Docker runtime artifacts
        run: |
          bash scripts/prepare-docker-context.sh stargate-next pnpm
          bash scripts/prepare-docker-context.sh playground pnpm
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - uses: docker/login-action@v4
        with:
          registry: ${{ needs['registry-config'].outputs.registry }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Plan release images
        id: image-plan
        env:
          STARGATE_NEXT_RELEASED: ${{ needs['release-please'].outputs.stargate_next_released }}
          STARGATE_NEXT_TAG: ${{ needs['release-please'].outputs.stargate_next_tag }}
          PLAYGROUND_RELEASED: ${{ needs['release-please'].outputs.playground_released }}
          PLAYGROUND_TAG: ${{ needs['release-please'].outputs.playground_tag }}
          DB_RELEASED: ${{ needs['release-please'].outputs.db_released }}
          DB_TAG: ${{ needs['release-please'].outputs.db_tag }}
          STARGATE_NEXT_IMAGE: ${{ needs['registry-config'].outputs.stargate_next_image }}
          PLAYGROUND_IMAGE: ${{ needs['registry-config'].outputs.playground_image }}
          DB_IMAGE: ${{ needs['registry-config'].outputs.db_image }}
        run: |
          set -euo pipefail
          targets=()
          plan_image() {
            local target="$1"
            local image="$2"
            local component="$3"
            local released="$4"
            local tag="$5"
            local output="$6"
            [ "$released" = "true" ] || return 0
            version="${tag#"${component}-v"}"
            test "$version" != "$tag"
            {
              echo "${output}<<EOF"
              echo "${image}:${version}"
              echo "${image}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            targets+=("$target")
          }
          plan_image "stargate-next" "$STARGATE_NEXT_IMAGE" "stargate-next" "$STARGATE_NEXT_RELEASED" "$STARGATE_NEXT_TAG" "stargate_next_tags"
          plan_image "playground" "$PLAYGROUND_IMAGE" "playground" "$PLAYGROUND_RELEASED" "$PLAYGROUND_TAG" "playground_tags"
          plan_image "db" "$DB_IMAGE" "db" "$DB_RELEASED" "$DB_TAG" "db_tags"
          echo "bake_targets=$(IFS=,; echo "${targets[*]}")" >> "$GITHUB_OUTPUT"
      - name: Build and push release images
        if: steps.image-plan.outputs.bake_targets != ''
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          push: true
          targets: ${{ steps.image-plan.outputs.bake_targets }}
        env:
          STARGATE_NEXT_TAGS: ${{ steps.image-plan.outputs.stargate_next_tags }}
          PLAYGROUND_TAGS: ${{ steps.image-plan.outputs.playground_tags }}
          DB_TAGS: ${{ steps.image-plan.outputs.db_tags }}

  npm:
    needs: release-please
    if: ${{ needs['release-please'].outputs.sdk_released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated SDK
        run: |
          pnpm sdk:generate
          git diff --exit-code -- packages/stargate-next-sdk/src
      - name: Verify npm package
        run: pnpm --filter @36node/stargate-next-sdk check:package
      - name: Publish npm package
        working-directory: packages/stargate-next-sdk
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN" --location=user
          fi
          npm publish --access public --provenance
