name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [SDK Alpha Build]
    types: [completed]

permissions:
  contents: read

env:
  IMAGE_REGISTRY_PROVIDER: ${{ vars.IMAGE_REGISTRY_PROVIDER || 'harbor' }}

jobs:
  registry-config:
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.registry.outputs.registry }}
      stargate_next_image: ${{ steps.registry.outputs.stargate_next_image }}
      playground_image: ${{ steps.registry.outputs.playground_image }}
      db_image: ${{ steps.registry.outputs.db_image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Resolve image registry
        id: registry
        run: bash scripts/resolve-image-registry.sh

  release-please:
    needs: registry-config
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      stargate_next_released: ${{ steps.release.outputs['apps/stargate-next--release_created'] }}
      stargate_next_tag: ${{ steps.release.outputs['apps/stargate-next--tag_name'] }}
      playground_released: ${{ steps.release.outputs['apps/playground--release_created'] }}
      playground_tag: ${{ steps.release.outputs['apps/playground--tag_name'] }}
      db_released: ${{ steps.release.outputs['packages/db--release_created'] }}
      db_tag: ${{ steps.release.outputs['packages/db--tag_name'] }}
      sdk_released: ${{ steps.release.outputs['packages/stargate-next-sdk--release_created'] }}
      sdk_tag: ${{ steps.release.outputs['packages/stargate-next-sdk--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    needs: [registry-config, release-please]
    if: ${{ needs['release-please'].outputs.stargate_next_released == 'true' || needs['release-please'].outputs.playground_released == 'true' || needs['release-please'].outputs.db_released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:ci --summarize
        env:
          NODE_ENV: production
          BUILD_STANDALONE: "true"
      - name: Prepare Docker runtime artifacts
        run: |
          bash scripts/prepare-docker-context.sh stargate-next pnpm
          bash scripts/prepare-docker-context.sh playground pnpm
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - uses: docker/login-action@v4
        with:
          registry: ${{ needs['registry-config'].outputs.registry }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Plan release images
        id: image-plan
        env:
          STARGATE_NEXT_RELEASED: ${{ needs['release-please'].outputs.stargate_next_released }}
          STARGATE_NEXT_TAG: ${{ needs['release-please'].outputs.stargate_next_tag }}
          PLAYGROUND_RELEASED: ${{ needs['release-please'].outputs.playground_released }}
          PLAYGROUND_TAG: ${{ needs['release-please'].outputs.playground_tag }}
          DB_RELEASED: ${{ needs['release-please'].outputs.db_released }}
          DB_TAG: ${{ needs['release-please'].outputs.db_tag }}
          STARGATE_NEXT_IMAGE: ${{ needs['registry-config'].outputs.stargate_next_image }}
          PLAYGROUND_IMAGE: ${{ needs['registry-config'].outputs.playground_image }}
          DB_IMAGE: ${{ needs['registry-config'].outputs.db_image }}
        run: |
          set -euo pipefail
          targets=()
          plan_image() {
            local target="$1"
            local image="$2"
            local component="$3"
            local released="$4"
            local tag="$5"
            local output="$6"
            [ "$released" = "true" ] || return 0
            version="${tag#"${component}-v"}"
            test "$version" != "$tag"
            {
              echo "${output}<<EOF"
              echo "${image}:${version}"
              echo "${image}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            targets+=("$target")
          }
          plan_image "stargate-next" "$STARGATE_NEXT_IMAGE" "stargate-next" "$STARGATE_NEXT_RELEASED" "$STARGATE_NEXT_TAG" "stargate_next_tags"
          plan_image "playground" "$PLAYGROUND_IMAGE" "playground" "$PLAYGROUND_RELEASED" "$PLAYGROUND_TAG" "playground_tags"
          plan_image "db" "$DB_IMAGE" "db" "$DB_RELEASED" "$DB_TAG" "db_tags"
          echo "bake_targets=$(IFS=,; echo "${targets[*]}")" >> "$GITHUB_OUTPUT"
      - name: Build and push release images
        if: steps.image-plan.outputs.bake_targets != ''
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          push: true
          targets: ${{ steps.image-plan.outputs.bake_targets }}
        env:
          STARGATE_NEXT_TAGS: ${{ steps.image-plan.outputs.stargate_next_tags }}
          PLAYGROUND_TAGS: ${{ steps.image-plan.outputs.playground_tags }}
          DB_TAGS: ${{ steps.image-plan.outputs.db_tags }}

  npm:
    needs: release-please
    if: ${{ needs['release-please'].outputs.sdk_released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated SDK
        run: |
          pnpm sdk:generate
          git diff --exit-code -- packages/stargate-next-sdk/src
      - name: Verify npm package
        run: pnpm --filter @36node/stargate-next-sdk check:package
      - name: Publish npm package
        working-directory: packages/stargate-next-sdk
        env:
          NPM_CONFIG_PROVENANCE: "false"
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN" --location=user
          fi
          npm publish --access public

  npm-alpha:
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.actor.login != 'dependabot[bot]' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.pull_requests[0].number != null
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Download SDK alpha artifact
        uses: actions/download-artifact@v8
        with:
          name: stargate-next-sdk-alpha
          path: ${{ runner.temp }}/sdk-alpha
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify SDK alpha artifact
        id: artifact
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/sdk-alpha
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          short_sha="${HEAD_SHA:0:7}"
          expected_name="@36node/stargate-next-sdk"
          expected_version="0.0.0-alpha.${PR_NUMBER}.g${short_sha}"
          tarball="$ARTIFACT_DIR/36node-stargate-next-sdk-${expected_version}.tgz"
          metadata="$ARTIFACT_DIR/metadata.json"

          test -f "$tarball"
          test -f "$metadata"
          test "$(wc -c < "$tarball")" -le 5242880
          jq -e \
            --arg head_sha "$HEAD_SHA" \
            --arg name "$expected_name" \
            --arg pr_number "$PR_NUMBER" \
            --arg version "$expected_version" \
            '.headSha == $head_sha and .name == $name and .prNumber == $pr_number and .version == $version' \
            "$metadata" > /dev/null

          package_json="$(tar -xOf "$tarball" package/package.json)"
          test "$(jq -r '.name' <<< "$package_json")" = "$expected_name"
          test "$(jq -r '.version' <<< "$package_json")" = "$expected_version"

          {
            echo "name=$expected_name"
            echo "version=$expected_version"
            echo "tag=alpha"
            echo "tarball=$tarball"
          } >> "$GITHUB_OUTPUT"
      - name: Check existing alpha version
        id: existing
        env:
          PACKAGE_NAME: ${{ steps.artifact.outputs.name }}
          PACKAGE_VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version \
            --registry https://registry.npmjs.org/ > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists; skipping publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish SDK alpha
        if: steps.existing.outputs.publish == 'true'
        env:
          NPM_CONFIG_PROVENANCE: "false"
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_TAG: ${{ steps.artifact.outputs.tag }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN" --location=user
          fi
          npm publish "$TARBALL" \
            --access public \
            --ignore-scripts \
            --registry https://registry.npmjs.org/ \
            --tag "$PACKAGE_TAG"
      - name: Write alpha summary
        env:
          PACKAGE_NAME: ${{ steps.artifact.outputs.name }}
          PACKAGE_TAG: ${{ steps.artifact.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.artifact.outputs.version }}
          PUBLISH_REQUIRED: ${{ steps.existing.outputs.publish }}
        run: |
          {
            echo "## SDK alpha package"
            echo
            echo "- Version: \`${PACKAGE_NAME}@${PACKAGE_VERSION}\`"
            echo "- Tag: \`${PACKAGE_TAG}\`"
            echo "- Published in this run: \`${PUBLISH_REQUIRED}\`"
            echo "- Install: \`pnpm add ${PACKAGE_NAME}@${PACKAGE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
