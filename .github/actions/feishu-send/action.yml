name: 'Feishu Send Message'
description: 'Send a message to a Feishu chat and return the message ID'

inputs:
  app_id:
    description: 'Feishu app ID'
    required: true
  app_secret:
    description: 'Feishu app secret'
    required: true
  chat_id:
    description: 'Feishu chat ID'
    required: true
  msg_type:
    description: 'Message type: text, post'
    required: false
    default: 'text'
  content:
    description: 'Message content. Text is plain text; post is JSON.'
    required: true
  uuid:
    description: 'Optional idempotency key for Feishu message creation'
    required: false
    default: ''

outputs:
  message_id:
    description: 'Message ID returned by Feishu'
    value: ${{ steps.send.outputs.message_id }}

runs:
  using: 'composite'
  steps:
    - name: Get Feishu token
      id: token
      shell: bash
      env:
        APP_ID: ${{ inputs.app_id }}
        APP_SECRET: ${{ inputs.app_secret }}
      run: |
        set -euo pipefail

        request_body="$(jq -n \
          --arg app_id "$APP_ID" \
          --arg app_secret "$APP_SECRET" \
          '{app_id: $app_id, app_secret: $app_secret}')"

        response="$(curl -sS -X POST 'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal' \
          -H 'Content-Type: application/json' \
          -d "$request_body")"

        token="$(echo "$response" | jq -r '.tenant_access_token // empty')"
        if [ -z "$token" ]; then
          echo "::error::Failed to get Feishu token: $response"
          exit 1
        fi

        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"

    - name: Send message
      id: send
      shell: bash
      env:
        FEISHU_TOKEN: ${{ steps.token.outputs.token }}
        CHAT_ID: ${{ inputs.chat_id }}
        MSG_TYPE: ${{ inputs.msg_type }}
        CONTENT: ${{ inputs.content }}
        UUID: ${{ inputs.uuid }}
      run: |
        set -euo pipefail

        if [ "$MSG_TYPE" = "text" ]; then
          msg_content="$(jq -n --arg text "$CONTENT" '{text: $text}')"
        else
          msg_content="$CONTENT"
        fi

        request_body="$(jq -n \
          --arg receive_id "$CHAT_ID" \
          --arg msg_type "$MSG_TYPE" \
          --arg content "$msg_content" \
          --arg uuid "$UUID" \
          '{
            receive_id: $receive_id,
            msg_type: $msg_type,
            content: $content
          } + (if $uuid == "" then {} else {uuid: $uuid} end)')"

        response="$(curl -sS -X POST 'https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id' \
          -H "Authorization: Bearer $FEISHU_TOKEN" \
          -H 'Content-Type: application/json' \
          -d "$request_body")"

        message_id="$(echo "$response" | jq -r '.data.message_id // empty')"
        if [ -z "$message_id" ]; then
          echo "::error::Failed to send Feishu message: $response"
          exit 1
        fi

        echo "message_id=$message_id" >> "$GITHUB_OUTPUT"
        echo "Sent Feishu message with ID: $message_id"
