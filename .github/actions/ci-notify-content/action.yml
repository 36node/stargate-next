name: 'CI Notify Content'
description: '根据 CI 结果生成统一的通知内容'

inputs:
  build_result:
    description: 'test-and-docker job 的结果 (success/failure/skipped)'
    required: true
  run_url:
    description: 'GitHub Actions run URL'
    required: true

outputs:
  overall:
    description: '总体状态 (success/failure)'
    value: ${{ steps.build.outputs.overall }}
  content:
    description: '通知内容文本'
    value: ${{ steps.build.outputs.content }}

runs:
  using: 'composite'
  steps:
    - name: Build notification content
      id: build
      shell: bash
      env:
        BUILD_RESULT: ${{ inputs.build_result }}
        RUN_URL: ${{ inputs.run_url }}
      run: |
        icon_for() {
          case "$1" in
            success) printf "✅" ;;
            failure) printf "❌" ;;
            *) printf "⏭️" ;;
          esac
        }

        if [ "$BUILD_RESULT" = "success" ]; then
          OVERALL="success"
        else
          OVERALL="failure"
        fi
        echo "overall=$OVERALL" >> $GITHUB_OUTPUT

        STATUS_LINE="构建与测试 $(icon_for "$BUILD_RESULT")"

        {
          echo "content<<EOF"
          echo "$STATUS_LINE"
          if [ "$OVERALL" != "success" ]; then
            echo ""
            echo "🔗 详情: $RUN_URL"
          fi
          echo "EOF"
        } >> $GITHUB_OUTPUT
