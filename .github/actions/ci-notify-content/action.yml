name: 'CI Notify Content'
description: '根据 CI 结果生成统一的通知内容'

inputs:
  test_and_build_result:
    description: 'test-and-build job 的结果 (success/failure/cancelled/skipped)'
    required: true
  build_helm_chart_result:
    description: 'build-helm-chart job 的结果 (success/failure/cancelled/skipped)'
    required: true
  run_url:
    description: 'GitHub Actions run URL'
    required: true

outputs:
  overall:
    description: '总体状态 (success/failure)'
    value: ${{ steps.build.outputs.overall }}
  content:
    description: '通知内容文本'
    value: ${{ steps.build.outputs.content }}

runs:
  using: 'composite'
  steps:
    - name: Build notification content
      id: build
      shell: bash
      env:
        TEST_AND_BUILD_RESULT: ${{ inputs.test_and_build_result }}
        BUILD_HELM_CHART_RESULT: ${{ inputs.build_helm_chart_result }}
        RUN_URL: ${{ inputs.run_url }}
      run: |
        icon_for() {
          case "$1" in
            success) printf "✅" ;;
            failure) printf "❌" ;;
            cancelled) printf "⏹️" ;;
            skipped) printf "⏭️" ;;
            *) printf "❓" ;;
          esac
        }

        if [ "$TEST_AND_BUILD_RESULT" = "success" ] &&
          { [ "$BUILD_HELM_CHART_RESULT" = "success" ] || [ "$BUILD_HELM_CHART_RESULT" = "skipped" ]; }; then
          OVERALL="success"
        else
          OVERALL="failure"
        fi
        echo "overall=$OVERALL" >> $GITHUB_OUTPUT

        {
          echo "content<<EOF"
          echo "CI 结果：$(icon_for "$OVERALL")"
          echo ""
          echo "测试与镜像构建：$(icon_for "$TEST_AND_BUILD_RESULT") $TEST_AND_BUILD_RESULT"
          echo "Helm Chart 构建与发布：$(icon_for "$BUILD_HELM_CHART_RESULT") $BUILD_HELM_CHART_RESULT"
          echo ""
          echo "🔗 详情: $RUN_URL"
          echo "EOF"
        } >> $GITHUB_OUTPUT
