name: Install Node.js from internal mirror
description: Download and install a Linux x64 Node.js release from the internal distribution mirror.

inputs:
  node-version:
    description: Exact Node.js version to install.
    required: true
  mirror:
    description: Base URL of the Node.js distribution mirror (without /dist).
    required: true
  registry-url:
    description: Optional npm registry URL used to configure authentication.
    required: false
    default: ''
  scope:
    description: Optional npm scope associated with registry-url.
    required: false
    default: ''
  always-auth:
    description: Whether npm should always send authentication credentials.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Download Node.js from mirror
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
        NODE_DIST_MIRROR: ${{ inputs.mirror }}
      run: |
        set -euo pipefail

        if [[ -z "$NODE_DIST_MIRROR" ]]; then
          echo '::error::Node.js distribution mirror is not configured.'
          exit 1
        fi

        node_arch='x64'
        case "$(uname -s):$(uname -m)" in
          Linux:x86_64|Linux:amd64)
            node_arch='x64'
            ;;
          *)
            echo "::error::Unsupported runner platform: $(uname -s) $(uname -m). This action currently supports Linux x64 only."
            exit 1
            ;;
        esac

        node_file="node-v${NODE_VERSION}-linux-${node_arch}.tar.gz"

        temp_dir="$(mktemp -d)"
        install_dir="$RUNNER_TEMP/node-${NODE_VERSION}-${node_arch}"
        trap 'rm -rf "$temp_dir"' EXIT

        mirror_base="${NODE_DIST_MIRROR%/}/dist/v${NODE_VERSION}"
        archive_path="$temp_dir/$node_file"
        checksum_path="$temp_dir/SHASUMS256.txt"

        echo "Downloading Node.js checksums from ${mirror_base}/SHASUMS256.txt"
        curl --fail --location --retry 3 --retry-all-errors --connect-timeout 10 \
          --output "$checksum_path" \
          "${mirror_base}/SHASUMS256.txt"

        expected_sha256="$(awk -v file="$node_file" '$2 == file { print $1; exit }' "$checksum_path")"
        if [[ -z "$expected_sha256" ]]; then
          echo "::error::Checksum not found for ${node_file}."
          exit 1
        fi

        echo "Downloading Node.js ${NODE_VERSION} (${node_arch}) from ${mirror_base}/${node_file}"
        curl --fail --location --retry 3 --retry-all-errors --connect-timeout 10 \
          --output "$archive_path" \
          "${mirror_base}/${node_file}"

        printf '%s  %s\n' "$expected_sha256" "$archive_path" | sha256sum --check --status

        rm -rf "$install_dir"
        mkdir -p "$install_dir"
        tar --extract --gzip --strip-components=1 --file "$archive_path" --directory "$install_dir"

        echo "$install_dir/bin" >> "$GITHUB_PATH"
        echo "Installed Node.js: $install_dir/bin/node"
        "$install_dir/bin/node" --version

    - name: Configure npm authentication
      if: ${{ inputs.registry-url != '' }}
      shell: bash
      env:
        REGISTRY_URL: ${{ inputs.registry-url }}
        SCOPE: ${{ inputs.scope }}
        ALWAYS_AUTH: ${{ inputs.always-auth }}
      run: |
        set -euo pipefail

        npmrc_path="${RUNNER_TEMP}/.npmrc"
        registry_url="${REGISTRY_URL%/}/"
        scope="$SCOPE"
        if [[ -z "$scope" && "$registry_url" == *npm.pkg.github.com/* ]]; then
          scope="${GITHUB_REPOSITORY_OWNER:-}"
        fi
        if [[ -n "$scope" && "$scope" != @* ]]; then
          scope="@${scope}"
        fi
        if [[ -n "$scope" ]]; then
          scope="${scope,,}:"
        fi

        auth_key="${registry_url#*:}"
        {
          printf '%s\n' "${auth_key}:_authToken=\${NODE_AUTH_TOKEN}"
          printf '%s\n' "${scope}registry=${registry_url}"
          printf '%s\n' "always-auth=${ALWAYS_AUTH}"
        } > "$npmrc_path"

        echo "NPM_CONFIG_USERCONFIG=$npmrc_path" >> "$GITHUB_ENV"
