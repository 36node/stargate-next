name: 'Feishu Reply Message'
description: '回复飞书消息（在话题内）'

inputs:
  app_id:
    description: '飞书应用 App ID'
    required: true
  app_secret:
    description: '飞书应用 App Secret'
    required: true
  message_id:
    description: '要回复的消息 ID'
    required: true
  content:
    description: '回复内容（文本）'
    required: true
  reply_in_thread:
    description: '是否在话题内回复'
    required: false
    default: 'true'

outputs:
  message_id:
    description: '回复消息的 ID'
    value: ${{ steps.reply.outputs.message_id }}

runs:
  using: 'composite'
  steps:
    - name: Get Feishu token
      id: token
      shell: bash
      env:
        APP_ID: ${{ inputs.app_id }}
        APP_SECRET: ${{ inputs.app_secret }}
      run: |
        RESPONSE=$(curl -s -X POST 'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal' \
          -H 'Content-Type: application/json' \
          -d "{\"app_id\": \"${APP_ID}\", \"app_secret\": \"${APP_SECRET}\"}")

        TOKEN=$(echo "$RESPONSE" | jq -r '.tenant_access_token')
        if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
          echo "::error::Failed to get Feishu token: $RESPONSE"
          exit 1
        fi
        echo "token=$TOKEN" >> $GITHUB_OUTPUT

    - name: Reply message
      id: reply
      shell: bash
      env:
        FEISHU_TOKEN: ${{ steps.token.outputs.token }}
        MESSAGE_ID: ${{ inputs.message_id }}
        CONTENT: ${{ inputs.content }}
        REPLY_IN_THREAD: ${{ inputs.reply_in_thread }}
      run: |
        MSG_CONTENT=$(jq -n --arg text "$CONTENT" '{"text": $text}')
        THREAD_FLAG=$([ "$REPLY_IN_THREAD" = "true" ] && echo "true" || echo "false")
        REQUEST_BODY=$(jq -n --arg content "$MSG_CONTENT" --argjson thread "$THREAD_FLAG" '{"msg_type": "text", "content": $content, "reply_in_thread": $thread}')

        RESPONSE=$(curl -s -X POST "https://open.feishu.cn/open-apis/im/v1/messages/${MESSAGE_ID}/reply" \
          -H "Authorization: Bearer $FEISHU_TOKEN" \
          -H 'Content-Type: application/json' \
          -d "$REQUEST_BODY")

        REPLY_ID=$(echo "$RESPONSE" | jq -r '.data.message_id')
        if [ "$REPLY_ID" = "null" ] || [ -z "$REPLY_ID" ]; then
          echo "::warning::Failed to reply Feishu message: $RESPONSE"
        else
          echo "message_id=$REPLY_ID" >> $GITHUB_OUTPUT
          echo "Replied with message ID: $REPLY_ID"
        fi
