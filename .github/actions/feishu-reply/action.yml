name: 'Feishu Reply Message'
description: 'Reply to a Feishu message, optionally in the message thread'

inputs:
  app_id:
    description: 'Feishu app ID'
    required: true
  app_secret:
    description: 'Feishu app secret'
    required: true
  message_id:
    description: 'Message ID to reply to'
    required: true
  msg_type:
    description: 'Message type: text, post'
    required: false
    default: 'text'
  content:
    description: 'Reply content. Text is plain text; post is JSON.'
    required: true
  reply_in_thread:
    description: 'Whether to reply in thread'
    required: false
    default: 'true'

outputs:
  message_id:
    description: 'Reply message ID returned by Feishu'
    value: ${{ steps.reply.outputs.message_id }}

runs:
  using: 'composite'
  steps:
    - name: Get Feishu token
      id: token
      shell: bash
      env:
        APP_ID: ${{ inputs.app_id }}
        APP_SECRET: ${{ inputs.app_secret }}
      run: |
        set -euo pipefail

        request_body="$(jq -n \
          --arg app_id "$APP_ID" \
          --arg app_secret "$APP_SECRET" \
          '{app_id: $app_id, app_secret: $app_secret}')"

        response="$(curl -sS -X POST 'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal' \
          -H 'Content-Type: application/json' \
          -d "$request_body")"

        token="$(echo "$response" | jq -r '.tenant_access_token // empty')"
        if [ -z "$token" ]; then
          echo "::error::Failed to get Feishu token: $response"
          exit 1
        fi

        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"

    - name: Reply message
      id: reply
      shell: bash
      env:
        FEISHU_TOKEN: ${{ steps.token.outputs.token }}
        MESSAGE_ID: ${{ inputs.message_id }}
        MSG_TYPE: ${{ inputs.msg_type }}
        CONTENT: ${{ inputs.content }}
        REPLY_IN_THREAD: ${{ inputs.reply_in_thread }}
      run: |
        set -euo pipefail

        case "$MSG_TYPE" in
          text)
            msg_content="$(jq -n --arg text "$CONTENT" '{text: $text}')"
            ;;
          post)
            if ! jq -e . >/dev/null 2>&1 <<< "$CONTENT"; then
              echo "::error::Post content must be valid JSON"
              exit 1
            fi
            msg_content="$CONTENT"
            ;;
          *)
            echo "::error::Unsupported message type: $MSG_TYPE"
            exit 1
            ;;
        esac

        thread_flag="$([ "$REPLY_IN_THREAD" = "true" ] && echo "true" || echo "false")"
        request_body="$(jq -n \
          --arg msg_type "$MSG_TYPE" \
          --arg content "$msg_content" \
          --argjson reply_in_thread "$thread_flag" \
          '{msg_type: $msg_type, content: $content, reply_in_thread: $reply_in_thread}')"

        response="$(curl -sS -X POST "https://open.feishu.cn/open-apis/im/v1/messages/${MESSAGE_ID}/reply" \
          -H "Authorization: Bearer $FEISHU_TOKEN" \
          -H 'Content-Type: application/json' \
          -d "$request_body")"

        reply_id="$(echo "$response" | jq -r '.data.message_id // empty')"
        if [ -z "$reply_id" ]; then
          echo "::error::Failed to reply Feishu message: $response"
          exit 1
        fi

        echo "message_id=$reply_id" >> "$GITHUB_OUTPUT"
        echo "Replied with Feishu message ID: $reply_id"
