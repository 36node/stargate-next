global:
  imageRegistry: harbor.36node.com
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

stargateNext:
  enabled: true
  replicaCount: 1
  image:
    repository: stargate/stargate-next
    tag: main
    digest: ""
    pullPolicy: ""
    pullSecrets: []
  service:
    type: ClusterIP
    port: 9527
  config:
    nodeEnv: production
    logLevel: info
    redisKeyPrefix: "stargate-next:"
    accessTokenTtlSeconds: "3600"
    refreshTokenTtlSeconds: "604800"
    accountCreateIdempotencyTtlSeconds: "3600"
    captchaTtlSeconds: "300"
    captchaMaxAttempts: "5"
    captchaCreateLimit: "30"
    captchaCreateWindowSeconds: "60"
    loginMaxAttempts: "5"
    loginLockSeconds: "60"
    passwordChangeMaxAttempts: "5"
    passwordChangeLockSeconds: "60"
  secrets:
    databaseUrl: ""
    redisUrl: ""
    stargateAdminApiKey: ""
    stargateApiKey: ""
    stargateJwtSecret: ""
    captchaHmacSecret: ""
    refreshKeyHmacPrimaryKeyId: ""
    refreshKeyHmacPrimarySecret: ""
    refreshKeyHmacSecondaryKeyId: ""
    refreshKeyHmacSecondarySecret: ""
    tenantApiKeyHmacPrimaryKeyId: ""
    tenantApiKeyHmacPrimarySecret: ""
    tenantApiKeyHmacSecondaryKeyId: ""
    tenantApiKeyHmacSecondarySecret: ""
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

playground:
  enabled: true
  replicaCount: 1
  image:
    repository: stargate/playground
    tag: main
    digest: ""
    pullPolicy: ""
    pullSecrets: []
  service:
    type: ClusterIP
    port: 3000
  config:
    stargateAuthBackend: next
    stargateEndpoint: ""
    stargateJwtPublicKey: ""
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

db:
  migration:
    enabled: true
    image:
      repository: stargate/db
      tag: main
      digest: ""
      pullPolicy: ""
      pullSecrets: []
    resources: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""
  stargateNext:
    enabled: false
    host: ""
    path: /
    pathType: Prefix
  playground:
    enabled: true
    host: ""
    path: /
    pathType: Prefix
