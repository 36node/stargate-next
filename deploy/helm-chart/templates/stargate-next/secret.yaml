{{- if .Values.stargateNext.enabled }}
{{- $temporaryPr42 := hasPrefix "0.0.0-pr-42-" .Chart.Version }}
{{- $adminApiKey := .Values.stargateNext.secrets.stargateAdminApiKey }}
{{- $tenantApiKeyHmacPrimaryKeyId := .Values.stargateNext.secrets.tenantApiKeyHmacPrimaryKeyId }}
{{- $tenantApiKeyHmacPrimarySecret := .Values.stargateNext.secrets.tenantApiKeyHmacPrimarySecret }}
{{- if $temporaryPr42 }}
{{- /* TODO(ticket-232): remove after the cluster playbook injects the dedicated multi-tenant secrets. */}}
{{- $adminApiKey = printf "stargate-next-pr-admin:%s" .Values.stargateNext.secrets.stargateApiKey | sha256sum }}
{{- $tenantApiKeyHmacPrimaryKeyId = "ticket-232-preview-primary" }}
{{- $tenantApiKeyHmacPrimarySecret = printf "stargate-next-pr-tenant-api-key:%s" .Values.stargateNext.secrets.refreshKeyHmacPrimarySecret | sha256sum }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stargate-next.serviceName" . }}-secret
  labels:
    {{- include "stargate-next.labels" . | nindent 4 }}
    app.kubernetes.io/component: stargate-next
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.stargateNext.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.stargateNext.secrets.redisUrl | quote }}
  STARGATE_ADMIN_API_KEY: {{ $adminApiKey | quote }}
  STARGATE_API_KEY: {{ .Values.stargateNext.secrets.stargateApiKey | quote }}
  STARGATE_JWT_SECRET: {{ .Values.stargateNext.secrets.stargateJwtSecret | quote }}
  CAPTCHA_HMAC_SECRET: {{ .Values.stargateNext.secrets.captchaHmacSecret | quote }}
  REFRESH_KEY_HMAC_PRIMARY_KEY_ID: {{ .Values.stargateNext.secrets.refreshKeyHmacPrimaryKeyId | quote }}
  REFRESH_KEY_HMAC_PRIMARY_SECRET: {{ .Values.stargateNext.secrets.refreshKeyHmacPrimarySecret | quote }}
  TENANT_API_KEY_HMAC_PRIMARY_KEY_ID: {{ $tenantApiKeyHmacPrimaryKeyId | quote }}
  TENANT_API_KEY_HMAC_PRIMARY_SECRET: {{ $tenantApiKeyHmacPrimarySecret | quote }}
  {{- if .Values.stargateNext.secrets.refreshKeyHmacSecondaryKeyId }}
  REFRESH_KEY_HMAC_SECONDARY_KEY_ID: {{ .Values.stargateNext.secrets.refreshKeyHmacSecondaryKeyId | quote }}
  {{- end }}
  {{- if .Values.stargateNext.secrets.refreshKeyHmacSecondarySecret }}
  REFRESH_KEY_HMAC_SECONDARY_SECRET: {{ .Values.stargateNext.secrets.refreshKeyHmacSecondarySecret | quote }}
  {{- end }}
  {{- if .Values.stargateNext.secrets.tenantApiKeyHmacSecondaryKeyId }}
  TENANT_API_KEY_HMAC_SECONDARY_KEY_ID: {{ .Values.stargateNext.secrets.tenantApiKeyHmacSecondaryKeyId | quote }}
  {{- end }}
  {{- if .Values.stargateNext.secrets.tenantApiKeyHmacSecondarySecret }}
  TENANT_API_KEY_HMAC_SECONDARY_SECRET: {{ .Values.stargateNext.secrets.tenantApiKeyHmacSecondarySecret | quote }}
  {{- end }}
{{- end }}
