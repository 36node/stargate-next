{{- if .Values.stargateNext.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stargate-next.serviceName" . }}
  labels:
    {{- include "stargate-next.labels" . | nindent 4 }}
    app.kubernetes.io/component: stargate-next
spec:
  type: {{ .Values.stargateNext.service.type }}
  ports:
    - name: http
      port: {{ .Values.stargateNext.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "stargate-next.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: stargate-next
{{- end }}
