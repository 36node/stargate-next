{{- if .Values.db.migration.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stargate-next.fullname" . }}-migration
  labels:
    {{- include "stargate-next.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.stargateNext.secrets.databaseUrl | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "stargate-next.fullname" . }}-migration-{{ .Release.Revision }}
  labels:
    {{- include "stargate-next.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "stargate-next.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- include "stargate-next.imagePullSecrets" (dict "image" .Values.db.migration.image "global" .Values.global) | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "stargate-next.image" (dict "image" .Values.db.migration.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.db.migration.image.pullPolicy | default .Values.global.imagePullPolicy }}
          command: ["sh", "-c", "prisma migrate deploy"]
          envFrom:
            - secretRef:
                name: {{ include "stargate-next.fullname" . }}-migration
          resources:
            {{- toYaml .Values.db.migration.resources | nindent 12 }}
{{- end }}
