services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stargate-next-local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - stargate_next_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - stargate_next_redis_data:/data

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - stargate_legacy_mongodb_data:/data/db

volumes:
  stargate_next_postgres_data:
  stargate_next_redis_data:
  stargate_legacy_mongodb_data:
